[package]
name = "retrodrive-launcher"
version = "0.2.2"
description = "Portable controller-first launcher for RetroDrive"
authors = ["RetroDrive"]
edition = "2021"
rust-version = "1.97"
default-run = "RetroDriveLauncher"

[lib]
name = "retrodrive_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "RetroDriveLauncher"
path = "src/main.rs"

[[bin]]
name = "START"
path = "src/bin/start.rs"

[[bin]]
name = "Updater"
path = "src/bin/updater.rs"

[[bin]]
name = "release-manifest"
path = "src/bin/release_manifest.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
fs2 = "0.4.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-single-instance = "2.4.3"
thiserror = "2.0.19"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
