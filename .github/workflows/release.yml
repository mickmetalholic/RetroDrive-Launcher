name: Release portable launcher

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      notes:
        description: Optional summary stored in the signed update manifest
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "public/**"
      - "scripts/**"
      - "skills/**"
      - "src/**"
      - "src-tauri/**"
      - "tsconfig.json"
      - "vite.config.ts"

permissions:
  contents: write

concurrency:
  group: retrodrive-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REQUESTED_BUMP: ${{ inputs.bump }}
          REQUESTED_NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $automaticPatch = $env:EVENT_NAME -eq 'push' -and $env:REF_TYPE -eq 'branch'
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -or $automaticPatch) {
            $current = (& node scripts/version.mjs current).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Unable to read the current version.' }
            $currentTag = "v$current"
            $tagAtHead = @(& git tag --points-at HEAD --list $currentTag) -contains $currentTag
            $completeRelease = $false
            if ($tagAtHead) {
              $assetNames = @(& gh release view $currentTag --json assets --jq '.assets[].name' 2>$null)
              if ($LASTEXITCODE -eq 0) {
                $requiredAssets = @('latest.json', "RetroDrive-Launcher-$currentTag.zip", 'SHA256SUMS.txt')
                $completeRelease = @($requiredAssets | Where-Object { $_ -notin $assetNames }).Count -eq 0
              }
            }
            if ($tagAtHead -and -not $completeRelease) {
              $version = $current
              $tag = $currentTag
              $publishRef = 'false'
              Write-Output "Retrying incomplete release $tag"
            }
            else {
              $bump = if ($automaticPatch) { 'patch' } else { $env:REQUESTED_BUMP }
              $version = (& node scripts/version.mjs bump $bump).Trim()
              if ($LASTEXITCODE -ne 0) { throw 'Version update failed.' }
              $tag = "v$version"
              $publishRef = 'true'
              git diff --check
              if ($LASTEXITCODE -ne 0) { throw 'Version update produced an invalid diff.' }
            }
          }
          else {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Release tag is not SemVer: $tag"
            }
            $version = $Matches.version
            node scripts/version.mjs verify $version
            if ($LASTEXITCODE -ne 0) { throw 'Tag and source versions do not match.' }
            $publishRef = 'false'
          }
          $notes = if ($env:REQUESTED_NOTES) { $env:REQUESTED_NOTES } else { "RetroDrive Launcher $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish_ref=$publishRef" >> $env:GITHUB_OUTPUT
          "notes<<RETRODRIVE_NOTES" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "RETRODRIVE_NOTES" >> $env:GITHUB_OUTPUT

      - name: Verify toolchains
        shell: pwsh
        run: |
          node --version
          pnpm --version
          rustc --version
          cargo --version

      - name: Test source
        run: pnpm check

      - name: Build production binaries
        run: pnpm build:release

      - name: Create signed portable assets
        shell: pwsh
        env:
          RETRODRIVE_SIGNING_PRIVATE_KEY: ${{ secrets.RETRODRIVE_SIGNING_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
        run: |
          pnpm release:portable -Version $env:RELEASE_VERSION -Tag $env:RELEASE_TAG -Notes $env:RELEASE_NOTES

      - name: Commit version and publish tag
        if: steps.release.outputs.publish_ref == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "Release $env:RELEASE_TAG"
          git tag -a $env:RELEASE_TAG -m "RetroDrive Launcher $env:RELEASE_TAG"
          git push --atomic origin HEAD:main $env:RELEASE_TAG

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $assets = @(
            "artifacts/release/RetroDrive-Launcher-$($env:RELEASE_TAG).zip"
            'artifacts/release/latest.json'
            'artifacts/release/SHA256SUMS.txt'
          )
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
            gh release edit $env:RELEASE_TAG --title "RetroDrive Launcher $($env:RELEASE_TAG)"
          }
          else {
            gh release create $env:RELEASE_TAG @assets `
              --title "RetroDrive Launcher $($env:RELEASE_TAG)" `
              --generate-notes `
              --verify-tag
          }
